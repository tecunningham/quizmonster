<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizMonster</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1 class="title">QuizMonster</h1>

        <!-- Start Screen -->
        <div id="start-screen" class="screen">
            <p class="subtitle">Can you tell them apart?</p>

            <div class="category-section">
                <label for="preset-select">Choose a category pair:</label>
                <select id="preset-select">
                    <option value="">-- Select preset --</option>
                </select>
            </div>

            <div class="divider">or create your own</div>

            <div class="custom-category">
                <input type="text" id="category1" placeholder="Category 1 (e.g., 1950s Buicks)">
                <input type="text" id="category2" placeholder="Category 2 (e.g., 1980s Buicks)">
            </div>

            <button id="start-btn" class="btn btn-primary">Start Quiz</button>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="screen hidden">
            <div class="round-info">
                <span id="round-counter">Round 1 of 5</span>
                <span id="score-display">Score: 0</span>
            </div>

            <p class="question">Click on the <strong id="target-label"></strong></p>

            <div class="images-container">
                <div class="image-card" data-index="0">
                    <div class="image-wrapper">
                        <img id="image-0" src="" alt="Option 1">
                        <div class="loading-spinner"></div>
                    </div>
                </div>
                <div class="image-card" data-index="1">
                    <div class="image-wrapper">
                        <img id="image-1" src="" alt="Option 2">
                        <div class="loading-spinner"></div>
                    </div>
                </div>
            </div>

            <button id="restart-btn" class="btn-restart" title="Restart">&#8635;</button>
        </div>

        <!-- Full-screen overlay for feedback -->
        <div id="overlay" class="overlay hidden">
            <div class="overlay-content">
                <div class="overlay-icon" id="overlay-icon"></div>
                <div class="overlay-text" id="overlay-text"></div>
            </div>
        </div>

        <!-- Loading Screen -->
        <div id="loading-screen" class="screen hidden">
            <div class="loader"></div>
            <p>Loading images...</p>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="screen hidden">
            <h2>Quiz Complete!</h2>
            <div class="final-score">
                <span id="final-score-value">0</span> / 5
            </div>
            <p id="result-message"></p>
            <button id="play-again-btn" class="btn btn-primary">Play Again</button>
        </div>
    </div>

    <script src="js/categories.js"></script>
    <script src="js/wikimedia.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
